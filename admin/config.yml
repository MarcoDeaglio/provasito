backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "contenuti"
    label: "Contenuti Sito Web"
    files:
      - file: "dati.json"
        label: "Tutti i Testi del Sito"
        name: "dati"
        format: "json"
        fields:
          - label: "Associazione"
            name: "associazione"
            widget: "object"
            fields:
              - { label: "Nome Associazione", name: "nome", widget: "string" }
              - { label: "Tipologia", name: "tipologia", widget: "string" }
              - { label: "Motto", name: "motto", widget: "string" }
              - { label: "Submotto", name: "submotto", widget: "text" }
              - { label: "La Nostra Fiamma", name: "laNostraFiamma", widget: "text" }
              - { label: "Sede Legale", name: "sedeLegale", widget: "string" }
              - { label: "Link Instagram", name: "instagramUrl", widget: "string" }

          - label: "Chi Siamo"
            name: "chiSiamo"
            widget: "object"
            fields:
              - { label: "Sottotitolo", name: "sottotitolo", widget: "string" }
              - { label: "Paragrafo 1", name: "paragrafo1", widget: "text" }
              - { label: "Paragrafo 2", name: "paragrafo2", widget: "text" }
              - { label: "Paragrafo 3", name: "paragrafo3", widget: "text" }
              - label: "Perché Hestía"
                name: "percheHestia"
                widget: "object"
                fields:
                  - { label: "Testo 1", name: "testo1", widget: "text" }
                  - { label: "Testo 2", name: "testo2", widget: "text" }

          - label: "Elenco Attività"
            name: "attivita"
            widget: "list"
            fields:
              - { label: "Titolo", name: "titolo", widget: "string" }
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Descrizione", name: "descrizione", widget: "text" }
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Target", name: "target", widget: "string" }
